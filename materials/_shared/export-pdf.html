<!--
  Export PDF snippet — paste into every learner Artifact.
  1) Put the <style> in <head>. 2) Put the button where controls live.
  3) Mark anything that must not print with class="no-print".
  4) Mark collapsible/tabbed content with class="print-expand" so it prints fully.
-->
<style>
  .export-pdf-btn{font:600 14px 'IBM Plex Sans Thai',sans-serif;background:#1F2933;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
  .export-pdf-btn:hover{background:#2E86AB}
  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .no-print,.export-pdf-btn,button,nav{display:none!important}
    .print-expand,[hidden].print-expand,details{display:block!important;height:auto!important;overflow:visible!important}
    section,.card{break-inside:avoid}
  }
</style>
<button class="export-pdf-btn no-print" onclick="window.print()" title="บันทึกเป็น PDF (เลือก Save as PDF)">⬇ Export PDF</button>
