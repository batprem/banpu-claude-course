<script>
const META = {"title": "Skills & Plugins", "module": "M5", "duration": "30 min (Lecture 10 / Workshop 20)"};
const SLIDES = [{"md": "<!-- type: section -->\n# M5 · Skills & Plugins\n\nสอน Claude \"วิธีทำงานแบบทีมเรา\" ครั้งเดียว ใช้ได้ทั้งทีม · ตรวจ Skill จากภายนอกก่อนติดตั้ง\n\n13:40–14:10 · 30 นาที (บรรยาย 10 · Workshop 20)", "notes": "[0:00] โมดูลหลังพักเที่ยง ต่อจาก M4 Document Factory: เมื่อเช้าเราสั่งงานด้วย prompt ยาว ๆ ทุกครั้ง บ่ายนี้จะ \"เก็บวิธีทำงาน\" เป็น Skill\nRequirement: 8 (Chat vs Skill vs Project…, Hands-on เต็มของ M1), 9 (Third-party Skill Security, Hands-on), 13 (usage efficiency)\nผลลัพธ์ที่ผู้เรียนได้กลับไป: Skill รายงานมาตรฐาน 1 ตัว + PDF ผลตรวจ Skill จากภายนอก 1 ฉบับ", "type": "section"}, {"md": "<!-- type: story -->\n# ก.พ. 2026: Skill ปลอม 341 ตัว ในร้าน Skill สาธารณะ\n\n- ClawHub = ร้านแจก Skill ฟรีของ AI agent ชื่อ OpenClaw (ไม่ใช่ Claude)\n- Koi Security ตรวจ 2,857 Skill พบ **341 ตัวที่เป็นมัลแวร์**\n- หน้าตาเหมือนเครื่องมือยอดนิยม แต่ให้ติดตั้ง \"prerequisite\" ก่อน\n- ผลคือโปรแกรมขโมยรหัสผ่าน และส่ง credential ออกไปภายนอก\n- ใครก็อัปโหลดได้: แค่มีบัญชี GitHub อายุ 1 สัปดาห์\n\n> Skill คือไฟล์ข้อความธรรมดา จึงแชร์ง่าย และปลอมง่ายพอ ๆ กัน", "notes": "[0:30] เล่า 1 นาที เป็นเคสจริงจากข่าว The Hacker News, ก.พ. 2026 (SOURCES #1) และ eSecurity Planet (SOURCES #2)\nย้ำว่าเป็น agent คนละตัวกับ Claude แต่ใช้แนวคิด \"Skill = โฟลเดอร์ + SKILL.md\" เหมือนกัน ความเสี่ยงจึงเป็นแบบเดียวกัน\nเชื่อมกับ M1: เช้านี้เราเห็นเคส Cato Networks (นักวิจัยทดลอง) ตอนนี้คือของจริงในวงกว้าง\nคำถามชวนคิด: \"ถ้าเพื่อนส่ง Skill ที่ทำรายงานสวยมากมาให้ทาง LINE จะติดตั้งเลยไหม?\" เก็บคำตอบไว้ เดี๋ยวได้ตรวจกันจริงใน workshop", "type": "story"}, {"md": "# Skill คืออะไร: โฟลเดอร์ที่สอน \"วิธีทำงาน\"\n\n```text\nbanpu-standard-report/\n├── SKILL.md              ← ชื่อ + description + ขั้นตอน โทน รูปแบบตัวเลข\n├── templates/report-template.md   ← โครง 6 หัวข้อ\n└── examples/example-report-site-b.md ← ตัวอย่างผลลัพธ์ที่ดี\n```\n\n- Claude **เลือกใช้เอง** เมื่องานตรงกับ description\n- เขียนเป็นภาษาคน ไม่ต้องเขียนโปรแกรม\n- บาง Skill มี script ด้วย → ต้องตรวจเหมือนติดตั้งโปรแกรม", "notes": "[2:00] เปิดโฟลเดอร์จริงใน materials/m5/skill-example/ ให้ดู 20 วินาที ชี้ frontmatter 2 บรรทัด name และ description: \"description คือป้ายหน้าร้าน Claude อ่านป้ายนี้ก่อนตัดสินใจว่าจะเปิด Skill ไหม\"\nใน Claude: Settings → Capabilities → Skills (บางเวอร์ชัน Customize → Skills) อัปโหลดเป็น ZIP ต้องเปิด Code execution ก่อน (SOURCES #4)\nClaude มี Skill สำเร็จรูปของ Anthropic อยู่แล้ว เช่น สร้าง Word/Excel/PowerPoint/PDF ที่เราใช้ใน M4 ก็มาจาก Skill", "type": "content"}, {"md": "# Prompt · Project · Skill · Connector · Plugin\n\n| | คืออะไร | ใช้เมื่อ | ตัวอย่าง |\n|---|---|---|---|\n| **Prompt** | คำสั่งงานครั้งนี้ | งานเดียวจบ | \"สรุปไฟล์นี้\" |\n| **Project** | ห้องเก็บบริบทของเรื่องหนึ่ง | คุยเรื่องเดิมต่อเนื่อง | โครงการปิดเหมืองสมมติ |\n| **Skill** | วิธีทำงานที่ใช้ซ้ำได้ทุกเรื่อง | งานรูปแบบเดิมซ้ำ ๆ | รายงานมาตรฐาน |\n| **Connector** | ท่อเชื่อมข้อมูล | ต้องอ่าน/เขียนระบบอื่น | SharePoint · Outlook |\n| **Plugin** | กล่องรวม Skill + Connector + คำสั่ง / | ชุดเครื่องมือของบทบาทงาน | ชุดงานการเงินสมมติ |", "notes": "[3:30] ทวนจาก M1 สั้น ๆ แล้วเพิ่ม 2 ตัวใหม่: Connector (M3) และ Plugin\nประโยคจำ: Project = \"เรื่องอะไร\" · Skill = \"ทำอย่างไร\" · Connector = \"ข้อมูลอยู่ไหน\" · Plugin = \"แพ็กรวมทั้งหมดให้ทีม\"\nPlugin ใน Cowork รวม Skill, Connector, slash command และ sub-agent เป็นชุดเดียว (SOURCES #5, #6) ติดตั้งได้เฉพาะที่ admin อนุญาต Plugin ที่มี Connector อื่นนอกจาก SharePoint/Outlook ไม่อยู่ในขอบเขตของบริษัท\nเคล็ดลับ: ใช้ร่วมกันได้ เช่น Project \"รายงานประจำเดือน\" + Skill รายงานมาตรฐาน + Connector SharePoint", "type": "content"}, {"md": "# ทำงานร่วมกันอย่างไร\n\n```mermaid\nflowchart LR\n    U[\"คุณ: Prompt<br/>สั่งงานครั้งนี้\"]:::human --> C[\"Claude / Cowork\"]:::ai\n    SK[\"Skill<br/>วิธีทำงานที่ใช้ซ้ำ\"]:::ai --> C\n    C <--> PR[(\"Project<br/>บริบทของเรื่องนี้\")]:::data\n    C <--> CN[(\"Connector<br/>SharePoint · Outlook\")]:::data\n    C --> O[\"ร่างผลงาน\"]:::ai --> R{\"คุณตรวจ<br/>/อนุมัติ\"}:::human\n    PL[\"Plugin<br/>ห่อรวม Skill + Connector<br/>+ คำสั่ง /\"]:::ai -.-> SK\n    PL -.-> CN\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector", "notes": "[5:00] ชี้ทีละกล่อง: เราพิมพ์ Prompt (สีส้ม) → Claude ดึงบริบทจาก Project, วิธีทำจาก Skill, ข้อมูลผ่าน Connector → ได้ร่าง → เราตรวจ\nเส้นประจาก Plugin = Plugin ไม่ได้ทำงานเอง แต่ \"ติดตั้ง Skill และ Connector ให้ทีละชุด\"\nถามห้อง 1 คำถาม: \"งานไหนของคุณที่สั่งด้วยประโยคเดิม ๆ ทุกเดือน?\" ให้ผู้เรียนจดไว้ 1 งาน = Skill ตัวแรกของเขาหลังอบรม", "type": "content"}, {"md": "# Skill ช่วยประหยัด usage ได้อย่างไร\n\n```mermaid\nflowchart LR\n    L1[(\"ทุก Skill: ชื่อ + description<br/>~100 token ต่อ Skill\")]:::data --> Q{\"งานตรงกับ<br/>Skill ไหม?\"}:::ai\n    Q -- ไม่ --> SKIP[\"ไม่โหลดเนื้อหา<br/>ไม่เสีย token เพิ่ม\"]:::ai\n    Q -- ใช่ --> L2[\"อ่าน SKILL.md<br/>+ template เมื่อจำเป็น\"]:::ai\n    L2 --> CK[\"คุณตรวจผล<br/>รูปแบบถูกตั้งแต่รอบแรก\"]:::human\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector\n\n- ไม่ต้องวางคำสั่ง + ตัวอย่างยาว ๆ ซ้ำทุกแชต\n- ได้รูปแบบถูกตั้งแต่รอบแรก = **รอบแก้น้อยลง**", "notes": "[6:00] กลไกนี้ Anthropic เรียกว่า progressive disclosure: ตอนเริ่มแชต Claude เห็นแค่ชื่อ + description ของทุก Skill (ประมาณ 100 token ต่อ Skill) จะอ่าน SKILL.md (แนะนำไม่เกิน ~5,000 token) และไฟล์อื่นเมื่องานตรงเท่านั้น (SOURCES #3, #10)\nพูดตรง ๆ: Skill ไม่ได้ทำให้ฟรี เมื่อใช้ Skill ก็ยังอ่าน SKILL.md แต่ที่ประหยัดจริงคือ (1) ไม่ต้อง paste คำสั่ง/ตัวอย่างยาวซ้ำ (2) รอบแก้ \"ขอหัวข้อแบบนี้ ไม่ใช่แบบนั้น\" หายไป (3) งานรูปแบบชัดใช้ model เบากว่าได้\nเชื่อม requirement 13 และ M8 (เคล็ดลับ usage): แชตใหม่ + Skill ดีกว่าแชตยาวที่สะสมคำสั่ง", "type": "content"}, {"md": "# แชร์ Skill ในทีม: ทำครั้งเดียว ใช้ทั้งที const deck = document.getElementById('deck');
marked.use({renderer:{code(code, lang){
  if(lang==='mermaid') return '<div class="mermaid">'+code+'</div>';
  return false;}}});
SLIDES.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+s.type; el.innerHTML=marked.parse(s.md)+
    '<div class="foot"><span>'+(META.module||'')+' · '+(META.title||'')+'</span><span>'+(i+1)+' / '+SLIDES.length+'</span></div>';
  deck.appendChild(el);
  const n=document.createElement('div'); n.className='notes'; n.textContent=s.notes; deck.appendChild(n);
});
mermaid.initialize({startOnLoad:false,theme:'base',themeVariables:{fontFamily:'IBM Plex Sans Thai',fontSize:'20px'}});
let cur=Math.max(0,Math.min(SLIDES.length-1,(parseInt(location.hash.slice(1))||1)-1));
const slides=[...document.querySelectorAll('.slide')], notes=[...document.querySelectorAll('.notes')];
async function show(i){cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,j)=>s.classList.toggle('active',j===cur));
  notes.forEach((s,j)=>s.classList.toggle('active',j===cur));
  history.replaceState(null,'','#'+(cur+1));
  const pending=slides[cur].querySelectorAll('.mermaid:not([data-processed])');
  if(pending.length){await document.fonts.ready; await mermaid.run({nodes:pending});}}
document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)) show(cur+1);
  if(['ArrowLeft','PageUp'].includes(e.key)) show(cur-1);
  if(e.key==='n') document.body.classList.toggle('show-notes');
  if(e.key==='p'){document.fonts.ready.then(()=>mermaid.run({querySelector:'.mermaid:not([data-processed])'})).then(()=>window.print());}
});
window.addEventListener('beforeprint',()=>mermaid.run({querySelector:'.mermaid:not([data-processed])'}));
show(cur);
</script></body></html>
