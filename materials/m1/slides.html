<script>
const META = {"title": "Claude Foundation & Security First", "module": "M1", "duration": "60 min (Lecture 40 / Workshop 20)"};
const SLIDES = [{"md": "<!-- type: section -->\n# M1 · Claude Foundation & Security First\n\nเข้าใจ Claude แบบ Agent · เลือกเครื่องมือให้ถูกงาน · ใช้อย่างปลอดภัยตั้งแต่วันแรก\n\n09:15–10:15 · 60 นาที (บรรยาย 40 · Workshop 20)", "notes": "[0:00] ทักทาย 30 วินาที แล้วเข้าเรื่องทันที โมดูลนี้ \"บังคับ\" ตามข้อกำหนดของทีม Hi-I\nเป้าหมาย: ก่อนจะให้ Claude ทำงานกับไฟล์จริงตอน M2–M7 ทุกคนต้องรู้ \"เส้นแดง\" ของข้อมูลก่อน", "type": "section"}, {"md": "# 60 นาทีนี้เราจะได้อะไร\n\n- รู้ว่า Claude / Cowork ทำงานแบบ **Agent** อย่างไร\n- เลือก Chat · Project · Skill · Agent · Artifact ได้ถูกงาน\n- เห็นความต่าง Chat vs Cowork จาก Demo จริง\n- รู้ความต่าง Personal / Team / Enterprise และข้อจำกัดของ Team\n- แยกข้อมูล 🟢 🟡 🔴 ได้ก่อนใส่ Claude\n- ใช้ model และ usage รายสัปดาห์อย่างคุ้มค่า", "notes": "[0:30] อ่านเร็ว ๆ ไม่ต้องอธิบายทีละข้อ บอกว่าท้ายโมดูลจะมีเกม Data Traffic Light ให้แข่งกัน ใครได้ 15/15 ได้ badge Data Guardian\nRequirement ที่ครอบคลุม: 2 (Security), 8 (เลือกเครื่องมือ), 9 (Third-party Skill), 13 (usage)", "type": "content"}, {"md": "<!-- type: story -->\n# กรกฎาคม 2025: แชต AI หลายพันรายการโผล่ใน Google\n\n- ผู้ใช้ ChatGPT กด Share แล้วติ๊ก \"Make this chat discoverable\" เพื่อแชร์ให้สะดวก\n- Fast Company ค้นเจอแชตที่แชร์ไว้ราว **4,500 รายการ** ใน Google\n- บางรายการมีชื่อคน ประวัติการทำงาน เรื่องส่วนตัว และเนื้อหางานที่เป็นความลับ\n- OpenAI ถอดฟีเจอร์ภายในไม่กี่วัน แต่ลิงก์ที่ถูก index แล้วยังค้างอยู่ระยะหนึ่ง\n- ไม่มีใครตั้งใจเปิดเผยข้อมูล แค่ **อยากแชร์งานให้เร็วขึ้น**\n\n> บทเรียน: ความเสี่ยงส่วนใหญ่มาจาก \"ความหวังดี + ไม่รู้เส้นแดง\" · คลิกเดียวก็พาข้อมูลออกนอกบริษัทได้", "notes": "[1:30] เล่าเป็นเรื่อง 1 นาที ไม่ต้องเน้นว่าเป็นเครื่องมือของใคร ประเด็นคือ \"พฤติกรรมผู้ใช้\"\nข้อเท็จจริง: Fast Company รายงาน 30 ก.ค. 2025 ว่าค้น Google เจอแชต ChatGPT ที่ผู้ใช้แชร์ไว้เกือบ 4,500 รายการ บางรายการระบุตัวคนได้ ต้นเหตุคือช่องติ๊ก \"Make this chat discoverable\" ตอนสร้างลิงก์แชร์ จากนั้น Dane Stuckey (CISO ของ OpenAI) ประกาศถอดฟีเจอร์และทำงานกับ search engine เพื่อลบผลค้นหา (ดู SOURCES.md #1, #2)\nถามห้อง: \"ใครเคยกด Share ลิงก์แชต หรือวางอะไรลง AI แล้วมานึกทีหลังว่า ไม่น่าเลย?\" (ไม่ต้องให้ตอบออกเสียง)\nเชื่อมต่อ: Claude Team ของบริษัทก็มีปุ่ม Share สำหรับแชต Project และ Artifact ก่อนกดทุกครั้งให้ถามว่า \"ใครจะเห็นได้บ้าง\" และลิงก์ที่แชร์แล้ว ถ้าถูกแปะต่อในที่สาธารณะ ก็ควบคุมไม่ได้อีก หลักเดียวกัน: เส้นแดงต้องชัดก่อนเริ่มใช้ (ลงรายละเอียดในส่วนที่ 4)", "type": "story"}, {"md": "<!-- type: section -->\n# 1 · Claude / Cowork คืออะไร\nจาก \"แชตบอต\" สู่ \"Agent ที่ลงมือทำงานให้\"", "notes": "[2:30] Section 1 ใช้เวลา ~6 นาที", "type": "section"}, {"md": "# Claude ที่เราใช้ในบริษัท\n\n| ส่วน | ทำอะไร |\n|---|---|\n| **Chat** | ถาม-ตอบ ร่างข้อความ สรุปไฟล์ที่แนบ |\n| **Cowork** (ใน Claude Desktop) | Agent ที่ทำงานกับไฟล์/โฟลเดอร์ในเครื่องเราได้หลายขั้นตอน |\n| **Connector** | เชื่อม SharePoint และ Outlook (M365) ที่ IT อนุมัติ |\n| **Artifact** | ผลงานแบบเปิดดู/กดเล่นได้ เช่น dashboard, app เล็ก ๆ |\n\nบัญชีที่ใช้: **Claude Team ของบริษัท** เท่านั้น", "notes": "[3:00] เปิด Claude Desktop ให้เห็นแท็บ Chat และ Cowork สั้น ๆ (ถ้ามีจอ)\nย้ำ: connector ที่ใช้ในหลักสูตรมีแค่ SharePoint และ Outlook จะลงลึกใน M3", "type": "content"}, {"md": "# Chatbot vs Agent ต่างกันตรงไหน\n\n| | Chatbot | Agent |\n|---|---|---|\n| รับงาน | คำถามทีละข้อ | **เป้าหมาย** |\n| วิธีทำ | ตอบเป็นข้อความ | คิด → วางแผน → ลงมือ |\n| เครื่องมือ | ไม่มี/น้อย | อ่าน-เขียนไฟล์ รันโค้ด ใช้ Connector |\n| บทบาทเรา | คนพิมพ์คำถาม | **หัวหน้างาน** ที่อนุมัติและตรวจผล |", "notes": "[4:00] เปรียบเทียบง่าย ๆ: Chatbot = ที่ปรึกษาที่ตอบคำถาม, Agent = ผู้ช่วยที่เราสั่งงานแล้วเขาไปทำมาให้\nประโยคจำ: \"เราเปลี่ยนจากคนพิมพ์ prompt เป็นหัวหน้างานของ AI\"", "type": "content"}, {"md": "# วงจรการทำงานของ Agent: คิด → วางแผน → ลงมือ\n\n```mermaid\nflowchart LR\n    G[\"คุณ: บอกเป้าหมาย\"]:::human --> T[\"คิด<br/>เข้าใจงาน\"]:::ai\n    T --> P[\"วางแผน<br/>แตกเป็นขั้นตอน\"]:::ai\n    P --> A{\"คุณอนุมัติแผน?\"}:::human\n    A -- ใช่ --> X[\"ลงมือ<br/>อ่าน/สร้างไฟล์\"]:::ai\n    A -- แก้ --> P\n    X <--> D[(\"ไฟล์ · SharePoint · Outlook\")]:::data\n    X --> C[\"ตรวจผล<br/>ก่อนใช้จริง\"]:::human\n    C -- ยังไม่ได้ --> T\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector", "notes": "[5:00] ชี้ทีละกล่อง: เป้าหมายมาจากเรา, Claude คิดและวางแผน, **เราอนุมัติแผน** (Human-in-the-Loop), แล้วจึงลงมือกับไฟล์/SharePoint/Outlook, สุดท้ายเราตรวจผล\nถ้าผลยังไม่ได้ วนกลับไปคิดใหม่ ไม่ใช่เริ่มจากศูนย์", "type": "content"}, {"md": "# Plan → Approve → Execute\n\n- Cowork จะ **เสนอแผนก่อน** แล้วรอเรา\n- อ่านแผนเหมือนอ่านใบสั่งงาน: ไฟล์ไหน ทำอะไร ผลอยู่ที่ไหน\n- งานที่ **ลบ ย้าย เขียนทับ ส่งออก** ต้องมีจุดอนุมัติเสมอ\n- สงสัยตรงไหน สั่งแก้แผนได้ก่อนเริ่ม\n- ผลลัพธ์ = ร่าง จนกว่าคนจะตรวจ", "notes": "[6:00] นี่คือหลัก Human-in-the-Loop (HITL) ที่จะเจอทุกโมดูล ใช้คำว่า \"Plan → Approve → Execute\" ให้ตรงกันทั้งหลักสูตร\nM2 จะฝึกจริงกับโฟลเดอร์ ~1,500 ไฟล์", "type": "content"}, {"md": "# ตัวอย่างงานแบบ Agent (บริบทบริษัทพลังงาน · ข้อมูลสมมติ)\n\n- รวม Excel ผลผลิต Site A–H หลายไฟล์ → สรุปแนวโน้ม\n- จัดโครงสร้างโฟลเดอร์งานเก่าหลายปี (M2)\n- ดึงอีเมลอัปเดตโครงการจาก Outlook → รายงานสัปดาห์ (M3, M6)\n- ทำ Monthly Operations Report จาก 5 แหล่ง (M4)\n- ตั้งงานซ้ำทุกสัปดาห์ พร้อมจุดให้คนตรวจ (M6)", "notes": "[7:30] สไลด์นี้คือ \"ตัวอย่างหนังตัวอย่าง\" ของทั้งวัน ชี้ว่าแต่ละข้อจะได้ทำในโมดูลไหน\nทุกตัวเลข/ชื่อ site ในหลักสูตรเป็นข้อมูลสมมติ", "type": "content"}, {"md": "<!-- type: section -->\n# 2 · เลือกเครื่องมือให้ถูกงาน\nChat · Project · Skill · Agent (Cowork) · Artifact", "notes": "[8:30] Section 2 ใช้เวลา ~8 นาที เป็น requirement 8", "type": "section"}, {"md": "# 5 เครื่องมือในภาพเดียว\n\n| เครื่องมือ | เหมาะกับ | ตัวอย่าง |\n|---|---|---|\n| **Chat** | งานสั้น ครั้งเดียวจบ | ร่างอีเมล อธิบายสูตร |\n| **Project** | หัวข้อเดียว ใช้บริบทเดิมซ้ำ | โครงการปิดเหมืองสมมติ |\n| **Skill** | วิธีทำงานแบบเดิม ใช้ซ้ำทุกหัวข้อ | รูปแบบรายงานมาตรฐาน |\n| **Agent (Cowork)** | หลายขั้น กับไฟล์/โฟลเดอร์ | รวม 20 ไฟล์ Excel |\n| **Artifact** | ผลลัพธ์ที่ดู/กด/แชร์ได้ | dashboard, เกม, diagram |", "notes": "[9:00] อธิบายภาพรวมก่อน แล้วแต่ละสไลด์ถัดไปลงทีละตัว\nจุดที่คนสับสนบ่อย: Project vs Skill → Project = \"ห้องเก็บบริบทของเรื่องหนึ่ง\", Skill = \"สูตรวิธีทำงานที่หยิบไปใช้ได้ทุกเรื่อง\"", "type": "content"}, {"md": "# Chat\n\n- เริ่มเร็วที่สุด ไม่ต้องตั้งค่า\n- เหมาะ: ถามความรู้ ร่างข้อความ สรุปไฟล์ 1–2 ไฟล์\n- แชตยาวมาก = ใช้ usage มาก และเริ่มลืมบริบทต้น ๆ\n- เคล็ดลับ: งานใหม่ = **เริ่มแชตใหม่**", "notes": "[10:00] ตัวอย่างสด (ถ้ามีเวลา): \"ช่วยอธิบาย XLOOKUP พร้อมตัวอย่างสมมติ\"\nโยงไป usage: แชตยาวทุกข้อความต้องอ่านประวัติทั้งหมด ยิ่งยาวยิ่งเปลือง (ลงรายละเอียดใน Section 5)", "type": "content"}, {"md": "# Project\n\n- \"ห้อง\" ของงานหนึ่งเรื่อง: เก็บเอกสารและคำสั่งประจำไว้\n- ทุกแชตในห้องเห็นบริบทเดียวกัน ไม่ต้องอัปโหลดซ้ำ\n- แชร์ให้เพื่อนในทีมได้ (บัญชี Team ของบริษัท)\n- ระวัง: ไฟล์ใน Project ต้องผ่าน Data Traffic Light ก่อน", "notes": "[11:00] ตัวอย่าง: Project \"รายงานประจำเดือน Site A–H\" เก็บ template + คำอธิบายตัวชี้วัด + ตัวอย่างรายงานเก่า (ข้อมูลสมมติ)\nข้อควรระวัง: ใส่ไฟล์ครั้งเดียว ทุกคนที่แชร์เห็น ต้องคิดก่อนใส่", "type": "content"}, {"md": "# Skill\n\n- \"สูตรวิธีทำงาน\" ที่ Claude โหลดมาใช้เมื่อเกี่ยวข้อง\n- เขียนครั้งเดียว ใช้ได้ทุกแชต ทุก Project ทุกคนในทีม\n- ตัวอย่าง: รูปแบบรายงานมาตรฐาน โทนภาษา โครงหัวข้อ\n- ช่วยลดการพิมพ์คำสั่งยาวซ้ำ ๆ = ประหยัด usage\n- ⚠️ Skill จากภายนอก **อาจไม่ผ่าน audit** (Section 4)", "notes": "[12:00] ลงมือสร้างจริงใน M5 ที่นี่แค่ให้รู้จักแนวคิด\nปูไปเรื่อง third-party Skill: Skill คือไฟล์คำสั่ง + บางครั้งมี script ที่รันได้ ถ้ามาจากคนไม่รู้จัก = เหมือนติดตั้งโปรแกรมแปลกหน้า", "type": "content"}, {"md": "# Agent (Cowork)\n\n- ให้สิทธิ์ **เฉพาะโฟลเดอร์ที่จำเป็น**\n- Claude สำรวจไฟล์ เสนอแผน รอเราอนุมัติ แล้วลงมือ\n- สร้าง/แก้ไฟล์จริงในเครื่อง: Word, Excel, PPT, HTML\n- ใช้ร่วมกับ Connector SharePoint / Outlook ได้\n- กฎทองก่อนให้แก้ไฟล์: **copy-before-write**", "notes": "[13:00] copy-before-write = ทำสำเนาก่อนให้ Claude แก้ จะลงลึกใน M3 (ไฟล์บน SharePoint ที่หลายคนแก้พร้อมกัน)\nแนะนำ: สร้างโฟลเดอร์ทำงานแยก เช่น Documents/Claude-Work แล้วให้สิทธิ์แค่โฟลเดอร์นั้น", "type": "content"}, {"md": "# Artifact\n\n- ผลงานที่ \"เปิดแล้วใช้ได้เลย\" ข้างหน้าแชต\n- Dashboard · App เล็ก ๆ · Prototype · Diagram · เกม\n- ปรับได้หลายเวอร์ชันด้วยการคุยต่อ\n- แชร์ภายในองค์กรผ่านบัญชีบริษัท\n- เกม Data Traffic Light วันนี้ก็เป็น Artifact", "notes": "[14:00] เมื่อไรใช้ Word/Excel/PPT แทน Artifact: เมื่อต้องส่งเป็นไฟล์ทางการ แนบอีเมล หรือคนรับไม่มี Claude → M4 ลงรายละเอียด\nArtifact ที่เรียก AI ข้างในจะใช้ usage ของ Team plan เกมวันนี้ไม่เรียก AI", "type": "content"}, {"md": "# Decision tree: งานนี้ใช้อะไรดี?\n\n```mermaid\nflowchart LR\n    S[\"งานของคุณ\"]:::human --> Q1{\"ถามตอบสั้น ๆ<br/>ครั้งเดียวจบ?\"}:::human\n    Q1 -- ใช่ --> CH[\"Chat\"]:::ai\n    Q1 -- ไม่ --> Q2{\"ต้องทำกับไฟล์/โฟลเดอร์<br/>หลายขั้นตอน?\"}:::human\n    Q2 -- ใช่ --> AG[\"Agent (Cowork)\"]:::ai\n    Q2 -- ไม่ --> Q3{\"ใช้บริบท/เอกสารชุดเดิม<br/>ซ้ำ ๆ ในหัวข้อเดียว?\"}:::human\n    Q3 -- ใช่ --> PR[\"Project\"]:::ai\n    Q3 -- ไม่ --> Q4{\"ทำงานรูปแบบเดิมซ้ำ<br/>หลายหัวข้อ/หลายคน?\"}:::human\n    Q4 -- ใช่ --> SK[\"Skill\"]:::ai\n    Q4 -- ไม่ --> CH\n    CH & PR & SK & AG --> Q5{\"ผลลัพธ์ต้องเห็นภาพ/<br/>กดเล่น/แชร์?\"}:::human\n    Q5 -- ใช่ --> AR[\"Artifact<br/>(Dashboard · App · Diagram)\"]:::data\n    Q5 -- ไม่ --> DOC[\"ไฟล์ Word/Excel/PPT/PDF\"]:::data\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector", "notes": "[15:00] เดินตามต้นไม้ 1 รอบด้วยโจทย์: \"ทำ dashboard ผลผลิตจาก Excel 6 site\"\n→ ไม่ใช่ถามสั้น → ทำกับไฟล์หลายขั้น → Agent (Cowork) → ต้องเห็นภาพ → Artifact/HTML\nย้ำว่าต้นไม้นี้คือ \"จุดเริ่ม\" ไม่ใช่กฎตายตัว เครื่องมือใช้ร่วมกันได้", "type": "content"}, {"md": "# Quick quiz: ใช้อะไรดี? (ยกมือ 1–5)\n\n1. ร่างอีเมลขอบคุณ supplier 1 ฉบับ\n2. ทุกเดือนต้องทำรายงานรูปแบบเดิม ให้ทั้งทีมใช้\n3. รวม 30 ไฟล์ Excel ในโฟลเดอร์ แล้วทำสรุป\n4. คุยเรื่องโครงการเดียวต่อเนื่อง 3 เดือน\n5. อยากได้หน้าจอให้ผู้บริหารกดดูตัวเลข\n\n`1 Chat · 2 Skill · 3 Agent (Cowork) · 4 Project · 5 Artifact`", "notes": "[16:00] ให้ห้องตอบพร้อมกันทีละข้อ ใช้เวลา 1 นาที (เฉลยบรรทัดล่างสุด เปิดหลังตอบ หรือปิดไว้ถ้าใช้ PDF)\nคำตอบอื่นอาจถูกได้ เช่น ข้อ 2 ใช้ Project + Skill ร่วมกัน ชมคนที่ให้เหตุผลได้", "type": "content"}, {"md": "<!-- type: section -->\n# 3 · Demo: Chat vs Cowork\nงานเดียวกัน · ไฟล์เดียวกัน · ผลต่างกันแค่ไหน", "notes": "[17:00] Section 3 ใช้เวลา ~8 นาที (demo ~6 นาที) เตรียมไฟล์ไว้ก่อนเริ่มคลาส ดู prompts.md M1-P01, M1-P02", "type": "section"}, {"md": "# โจทย์ Demo\n\n- ไฟล์: `site_ops_sample.xlsx` (ข้อมูลสมมติ 6 site × 21 เดือน)\n- เป้าหมาย: **HTML dashboard** ผลผลิตแผน vs จริง และต้นทุน\n- รอบ 1: Chat + แนบไฟล์ + prompt `M1-P01`\n- รอบ 2: Cowork + โฟลเดอร์ + prompt `M1-P02`\n- จับเวลา และนับว่า **เราต้องลงมือเองกี่ครั้ง**", "notes": "[17:30] ไฟล์อยู่ที่ materials/m1/data/site_ops_sample.xlsx (สร้างด้วย gen_site_ops.py)\nก่อน demo: คัดลอกไฟล์ไปไว้ในโฟลเดอร์ demo/M1 แยก และเปิด Settings → Usage ไว้ในแท็บหนึ่งเพื่อโชว์การใช้ usage\nให้ผู้เรียนช่วยนับ \"จำนวนครั้งที่คนต้อง copy/บันทึก/แก้เอง\"", "type": "content"}, {"md": "# งานเดียวกัน 2 วิธี\n\n```mermaid\nflowchart LR\n    X[(\"site_ops_sample.xlsx\")]:::data\n    subgraph CHAT[\"Chat ธรรมดา\"]\n      C1[\"คุณอัปโหลดไฟล์<br/>+ พิมพ์ prompt\"]:::human --> C2[\"Claude ตอบโค้ด/Artifact<br/>ในหน้าแชต\"]:::ai --> C3[\"คุณ copy ไปบันทึกเอง<br/>แก้เองทีละรอบ\"]:::human\n    end\n    subgraph COWORK[\"Cowork (Agent)\"]\n      K1[\"คุณให้สิทธิ์โฟลเดอร์<br/>+ บอกเป้าหมาย\"]:::human --> K2[\"Claude สำรวจไฟล์<br/>เสนอแผน\"]:::ai --> K3{\"คุณอนุมัติแผน\"}:::human --> K4[\"Claude สร้าง dashboard.html<br/>เปิดตรวจเอง แก้เอง\"]:::ai --> K5[\"คุณตรวจตัวเลข<br/>ก่อนแชร์\"]:::human\n    end\n    X --> C1\n    X --> K1\n    K4 --> O[(\"output/dashboard.html\")]:::data\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector", "notes": "[18:00] ทำ demo จริงตาม prompts.md:\n1) Chat: แนบไฟล์ วาง M1-P01 → ได้ Artifact/โค้ด → เราต้อง copy ไปบันทึกเป็น .html เอง ถ้าตัวเลขผิดต้องสั่งแก้แล้ว copy ใหม่\n2) Cowork: ชี้โฟลเดอร์ วาง M1-P02 → Claude สำรวจไฟล์ เสนอแผน (หยุดตรงนี้ ชี้ว่าเป็น HITL) → อนุมัติ → Claude สร้าง output/dashboard.html และตรวจผลเอง\nแผนสำรองถ้าเน็ต/usage มีปัญหา: เปิดไฟล์ผลที่เตรียมไว้ล่วงหน้า (ทำใน dry-run)", "type": "content"}, {"md": "# สิ่งที่เห็นจาก Demo\n\n| | Chat | Cowork |\n|---|---|---|\n| รับไฟล์ | แนบทีละไฟล์ | เข้าถึงโฟลเดอร์ที่อนุญาต |\n| แผนงาน | ไม่มี ตอบเลย | เสนอแผนให้อนุมัติ |\n| ผลลัพธ์ | อยู่ในแชต ต้อง copy เอง | ไฟล์จริงในโฟลเดอร์ |\n| ตรวจ/แก้ | เราสั่งแก้ทีละรอบ | Claude เปิดตรวจและแก้เอง |\n| เหมาะ | งานเล็ก ไฟล์เดียว | งานหลายขั้น หลายไฟล์ |", "notes": "[23:00] สรุปร่วมกับห้อง: ถามว่านับได้กี่ครั้งที่คนต้องลงมือเอง\nจุดสำคัญ: ทั้ง 2 วิธี \"เราต้องตรวจตัวเลข\" ก่อนใช้จริง AI ทำร่าง คนรับผิดชอบผล", "type": "content"}, {"md": "# ข้อสังเกตเรื่องความปลอดภัยจาก Demo\n\n- ไฟล์ demo เป็น **ข้อมูลสมมติ** ไฟล์งานจริงต้องผ่าน 🟢🟡🔴 ก่อน\n- Cowork เห็นทุกไฟล์ในโฟลเดอร์ที่ให้สิทธิ์ → ให้แค่ที่จำเป็น\n- ผลลัพธ์ต้องตรวจก่อนแชร์ (ตัวเลข สูตร ข้อสรุป)\n- Dashboard นี้ไม่ refresh เอง เป็นภาพ ณ เวลาที่สร้าง (M6)", "notes": "[24:00] เชื่อมเข้าสู่ Section 4 Security: \"เครื่องมือเก่งขึ้น = ความรับผิดชอบเราก็มากขึ้น\"\nเรื่อง dashboard refresh เป็น awareness ของ M6 แค่แตะไว้", "type": "content"}, {"md": "<!-- type: section -->\n# 4 · Security First\nPersonal / Team / Enterprise · นโยบายบริษัท · Data Traffic Light · Skill จากภายนอก", "notes": "[25:00] Section 4 ใช้เวลา ~10 นาที เป็นหัวใจของ requirement 2 และ 9", "type": "section"}, {"md": "# Personal vs Team vs Enterprise\n\n| | Personal (Free/Pro/Max) | **Team (ที่เราใช้)** | Enterprise |\n|---|---|---|---|\n| เจ้าของบัญชี | ตัวเรา | บริษัท | บริษัท |\n| ผู้ดูแลระบบ (admin) | ไม่มี | มี ควบคุมพื้นฐาน | ควบคุมละเอียด |\n| Audit log / Compliance API | ไม่มี | จำกัด | มีครบกว่า |\n| ใช้กับข้อมูลบริษัท | ❌ ห้าม | ✅ ตามนโยบาย | ✅ ตามนโยบาย |\n\n<small>ตรวจรายละเอียดล่าสุดที่ claude.com/pricing และ Anthropic Help Center<\/small>", "notes": "[25:30] พูดตรงไปตรงมา: Team มีการควบคุมของผู้ดูแลและบันทึกการใช้งานน้อยกว่า Enterprise (เช่น audit log เต็มรูปแบบ, Compliance API, การตั้ง data retention เป็น feature ของ Enterprise)\nฟีเจอร์เปลี่ยนบ่อย วิทยากรตรวจหน้า pricing/help center อีกครั้งในสัปดาห์อบรม (ดู Open questions ใน README)\nประเด็นที่ต้องได้: \"Personal ห้ามใช้กับข้อมูลบริษัท\" ไม่มีข้อยกเว้น", "type": "content"}, {"md": "# Team plan: ระบบดูแลได้บางส่วน ที่เหลือคือ \"วินัยของเรา\"\n\n- ระบบตรวจย้อนหลังได้ไม่ละเอียดเท่า Enterprise\n- ไม่มีใครมาเตือนก่อนเราวางข้อมูลผิด\n- การแชร์ Project/Artifact ทำได้ง่าย → แชร์ผิดก็ง่าย\n- ดังนั้นความปลอดภัยส่วนหนึ่ง **อยู่ที่ผู้ใช้ทุกคน**\n\n> Team = รถที่มีเบรก แต่ไม่มีระบบเบรกอัตโนมัติ คนขับต้องเหยียบเอง", "notes": "[27:00] ใช้ analogy รถ ให้จำง่าย\nไม่ต้องทำให้กลัวเกินไป Team ปลอดภัยกว่า Personal มาก (บริษัทเป็นเจ้าของบัญชี มี admin) แต่การกันข้อมูลอ่อนไหวไม่ให้เข้าไปเป็นหน้าที่ของเรา", "type": "content"}, {"md": "# นโยบายบ้านปู: 2 กฎที่ไม่มีข้อยกเว้น\n\n1. **ข้อมูลอ่อนไหวไม่ใส่ Claude** ใช้เครื่องมือที่บริษัทกำหนดสำหรับข้อมูลอ่อนไหวเท่านั้น\n2. **ห้ามใช้ Personal AI กับข้อมูลบริษัท** ไม่ว่าจะเป็นบัญชี Claude ส่วนตัวหรือ AI อื่น\n\n+ ใช้เฉพาะ Connector ที่ IT อนุมัติ: **SharePoint, Outlook**", "notes": "[28:00] อ่านช้า ๆ ทั้ง 2 ข้อ ให้ทุกคนพูดตาม (ถ้าบรรยากาศเอื้อ)\n\"เครื่องมือที่บริษัทกำหนดสำหรับข้อมูลอ่อนไหว\" — ชื่อเครื่องมือ/ช่องทางจริงให้ยืนยันกับ Hi-I ก่อนวันอบรม (Open question)\nGoogle Drive และ connector อื่นไม่อนุญาต", "type": "content"}, {"md": "# อะไรคือ \"ข้อมูลอ่อนไหว\"\n\n- ข้อมูลส่วนบุคคล: เลขบัตร เงินเดือน บัญชีธนาคาร สุขภาพ\n- ข้อมูลการเงินที่ **ยังไม่เปิดเผย** ต่อสาธารณะ\n- ความลับทางการค้า: ราคา สัญญา การเจรจา\n- รหัสผ่าน API key ข้อมูลเข้าระบบ\n- เอกสารที่มีชั้นความลับตามนโยบายบริษัท", "notes": "[29:00] เชื่อมกับ PDPA: ข้อมูลสุขภาพ ศาสนา ประวัติอาชญากรรม ฯลฯ เป็นข้อมูลอ่อนไหวพิเศษ\nข้อสังเกต: \"ข้อมูลที่ประกาศแล้ว\" เปลี่ยนจากแดงเป็นเขียวได้ เช่น งบการเงินหลังประกาศต่อตลาด", "type": "content"}, {"md": "# Data Traffic Light: ถามตัวเองก่อนวางทุกครั้ง\n\n```mermaid\nflowchart LR\n    D[(\"ข้อมูลที่จะใช้\")]:::data --> Q1{\"เป็นข้อมูลอ่อนไหว?<br/>บุคคล · สุขภาพ · การเงินยังไม่เปิดเผย<br/>· ความลับการค้า · รหัสผ่าน\"}:::human\n    Q1 -- ใช่ --> R[\"🔴 แดง ห้ามใส่ Claude<br/>ใช้เครื่องมือที่บริษัทกำหนด\"]:::human\n    Q1 -- ไม่ --> Q2{\"มีชื่อคน · เบอร์ · อีเมล<br/>· ชื่อคู่ค้า/ลูกค้า?\"}:::human\n    Q2 -- ใช่ --> Y[\"🟡 เหลือง<br/>anonymize ก่อน\"]:::human\n    Y --> AN[\"ลบ/แทนชื่อ · รวมกลุ่ม<br/>· ตัดคอลัมน์ที่ไม่ใช้\"]:::human\n    AN --> G\n    Q2 -- ไม่ --> G[\"🟢 เขียว ใช้ได้\"]:::human\n    G --> TEAM{\"ใช้บัญชี Claude Team<br/>ของบริษัท?\"}:::human\n    TEAM -- ใช่ --> C[\"Claude ทำงาน\"]:::ai\n    TEAM -- ไม่ใช่/บัญชีส่วนตัว --> STOP[\"หยุด · ห้ามใช้ Personal AI<br/>กับข้อมูลบริษัท\"]:::human\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector", "notes": "[30:00] นี่คือ diagram ที่จะใช้ในเกม workshop และทบทวนอีกครั้งใน M8\nสังเกตว่าเกือบทุกกล่องเป็นสีส้ม = การตัดสินใจของ \"คน\" ไม่ใช่ AI\nด่านสุดท้าย: แม้ข้อมูลเขียว ก็ต้องใช้บัญชี Team ของบริษัทเท่านั้น", "type": "content"}, {"md": "# 🟡 เหลือง → anonymize ยังไง\n\n| ก่อน | หลัง |\n|---|---|\n| คุณสมมติ ใจดี (หัวหน้ากะ) | หัวหน้ากะ A |\n| 081-234-5678 | (ลบออก) |\n| บริษัทสมมติ ก จำกัด | Customer 01 |\n| 14 ก.ย. 2026 กะดึก Site A | ก.ย. 2026 · Site A |\n\n- ตัดคอลัมน์ที่ไม่ได้ใช้ทิ้งก่อน\n- เก็บตารางจับคู่ชื่อจริงไว้ **นอก** Claude", "notes": "[31:00] เน้น: anonymize ดีที่สุดคือ \"ไม่ส่งสิ่งที่ไม่จำเป็น\" ตั้งแต่แรก\nถ้าลบชื่อแล้วยังเดาตัวคนได้ (เช่น มีคนเดียวในแผนก) ให้รวมกลุ่มให้ใหญ่ขึ้น หรือถือเป็นแดง\nWorkshop รอบ 2 จะฝึกใช้ Claude ช่วย anonymize ข้อความสมมติ (prompt M1-P04)", "type": "content"}, {"md": "# ความเสี่ยงใหม่: Skill จากภายนอก\n\n- Skill = คำสั่ง + ไฟล์ + บางครั้งมี **script ที่รันได้**\n- แชร์กันง่ายบน GitHub/โซเชียล แต่ **ยังไม่มีใคร audit**\n- Skill ที่ไม่หวังดีอาจสั่งให้อ่านไฟล์หรือส่งข้อมูลออก\n- ใช้ Skill ที่บริษัทสร้างหรือรับรองก่อนเสมอ", "notes": "[32:00] Requirement 9 ระดับ \"แนะนำแนวคิด\" ใน M1 ลงมือตรวจจริงด้วย checklist ใน M5\nAnthropic เองระบุในเอกสาร Skills สำหรับองค์กรว่า Skill ที่ไม่หวังดีอาจสั่งให้ Claude รันโค้ด เข้าถึงไฟล์ หรือส่งข้อมูลออก และไม่ควรใช้ Skill จากแหล่งที่ไม่น่าเชื่อถือโดยไม่ audit (SOURCES #3)", "type": "content"}, {"md": "# 4 คำถามก่อนติดตั้ง Skill (ลงมือจริงใน M5)\n\n```mermaid\nflowchart LR\n    S[(\"Skill จากภายนอก<br/>GitHub · โซเชียล · เพื่อนส่งมา\")]:::data --> C1{\"1 ที่มา<br/>ใครทำ เชื่อถือได้?\"}:::human\n    C1 --> C2{\"2 สิทธิ์<br/>ขอเข้าถึงอะไรบ้าง?\"}:::human\n    C2 --> C3{\"3 Script<br/>มีโค้ดที่รันได้?\"}:::human\n    C3 --> C4{\"4 ส่งข้อมูลออก<br/>มี URL/การเรียกเน็ต?\"}:::human\n    C4 -- ผ่านทุกข้อ + IT รับรอง --> OK[\"ติดตั้ง · Claude ใช้ Skill\"]:::ai\n    C1 & C2 & C3 & C4 -- ไม่แน่ใจ --> NO[\"ไม่ติดตั้ง<br/>ส่งให้ทีม IT/Hi-I ตรวจ\"]:::human\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector", "notes": "[33:00] จำง่าย 4 คำ: ที่มา · สิทธิ์ · Script · ส่งออก\nถ้าไม่แน่ใจข้อไหน = ไม่ติดตั้ง ส่งให้ทีม IT/Hi-I ตรวจ", "type": "content"}, {"md": "<!-- type: story -->\n# เคสจริง ธ.ค. 2025: Skill ที่ \"ดูดี\" แต่แอบซ่อนคำสั่ง\n\n- นักวิจัย Cato Networks นำ Skill แบบ open-source (สร้าง GIF) มาดัดแปลง\n- แทรกฟังก์ชันที่ดูปกติ แต่ไปดาวน์โหลดโค้ดภายนอกมารัน\n- ในเครื่องทดสอบ: ผู้ใช้อนุมัติครั้งเดียว → ไฟล์ถูกเข้ารหัสโดย ransomware\n- Anthropic ย้ำ: ผู้ใช้ต้องใช้เฉพาะ **Skill ที่เชื่อถือได้**\n\n> ติดตั้ง Skill = ติดตั้งโปรแกรม คิดแบบเดียวกัน", "notes": "[34:00] เป็น proof-of-concept ในสภาพแวดล้อมทดสอบของนักวิจัย (Cato CTRL, 2 Dec 2025) ไม่ใช่การโจมตีบริษัทใด ใช้ให้เห็นว่าเป็นไปได้จริง\nจุดสอน: Claude ตรวจโค้ดที่มองเห็นได้ แต่ไม่เห็นโค้ดที่ถูกดาวน์โหลดภายหลัง → การอนุมัติครั้งแรกของคนจึงสำคัญมาก\nที่มา: Cato Networks blog และ Axios (SOURCES #4, #5) · Anthropic enterprise Skills docs (SOURCES #3)\nไม่ต้องลงรายละเอียดเทคนิค เน้นพฤติกรรม: \"Skill ฟรีจากอินเทอร์เน็ต = โปรแกรมแปลกหน้า\"", "type": "story"}, {"md": "<!-- type: section -->\n# 5 · ใช้ให้คุ้ม\nเลือก model · weekly usage limit", "notes": "[35:00] Section 5 ใช้เวลา ~4 นาที requirement 13 (แนะนำแนวคิด ลงมือจริงใน M8)", "type": "section"}, {"md": "# เลือก model ให้เหมาะกับงาน\n\n```mermaid\nflowchart LR\n    T[\"งานที่จะทำ\"]:::human --> Q{\"ยาก/ต้องคิดลึก<br/>หลายขั้น?\"}:::human\n    Q -- งานทั่วไป --> S[\"Sonnet (ค่าเริ่มต้น)\"]:::ai\n    Q -- ง่าย/ซ้ำ/เร็ว --> H[\"Haiku\"]:::ai\n    Q -- ยากมาก/สำคัญ --> O[\"Opus\"]:::ai\n    S & H & O --> U[\"ตรวจ Settings → Usage<br/>ก่อนงานใหญ่\"]:::human\n    F[(\"ไฟล์ใหญ่ · แชตยาว\")]:::data --> TIP[\"ตัดเฉพาะส่วนที่ใช้<br/>· เริ่มแชตใหม่ · ใช้ Project/Skill\"]:::human\n    TIP --> U\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector", "notes": "[35:30] ชื่อรุ่นในเมนูอาจมีเลขเวอร์ชันต่างไปตามวันอบรม ให้ดูจากเมนูเลือก model จริง\nหลักคิด: Sonnet สำหรับงานทั่วไป, Haiku งานง่าย/เร็ว, Opus งานยาก/สำคัญ ใช้ usage มากกว่า\nถ้ามี Team plan บางรุ่นอาจจำกัดหรือใช้ usage เร็วกว่า ดู Open question ใน README", "type": "content"}, {"md": "# Weekly usage limit: รู้ไว้ก่อนชน\n\n- Team plan มี **โควตาต่อคน** ต่อรอบการใช้งาน และรายสัปดาห์\n- ดูการใช้และเวลารีเซ็ตที่ **Settings → Usage**\n- ใช้มากเมื่อ: แชตยาว · ไฟล์ใหญ่ · model ใหญ่ · Agent ทำหลายขั้น\n- Artifact ที่เรียก AI ข้างในก็ใช้โควตา\n- ชนแล้วต้องรอรอบใหม่ → วางแผนงานใหญ่ให้ดี", "notes": "[37:00] โชว์หน้า Settings → Usage จริง (ถ้าเปิดได้) ตัวเลขและรอบรีเซ็ตขึ้นกับการตั้งค่าของบริษัท/Anthropic ณ วันอบรม ให้ยืนยันใน dry-run\nอย่าให้ตัวเลขโควตาเฉพาะเจาะจงในห้อง เพราะเปลี่ยนได้\nข้อเท็จจริงจาก Help Center (SOURCES #6): limit เป็นรายคน ไม่ใช่รวมทั้งทีม · weekly limit รีเซ็ตเวลาคงที่ของแต่ละบัญชี · ที่นั่ง Standard/Premium ต่างกัน · องค์กรเปิด usage credits ให้ใช้ต่อหลังชน limit ได้ (ขึ้นกับการตั้งค่าของ admin บ้านปู)", "type": "content"}, {"md": "# 5 นิสัยประหยัด usage\n\n1. งานใหม่ = เริ่มแชตใหม่\n2. ส่งเฉพาะส่วนที่ใช้ ไม่แนบทั้งไฟล์ถ้าไม่จำเป็น\n3. เริ่มด้วย Sonnet ยกระดับเป็น Opus เมื่อจำเป็น\n4. งานซ้ำ → ใช้ Project/Skill แทนพิมพ์คำสั่งยาว\n5. ให้ Claude **วางแผนก่อน** ลดการทำผิดแล้วแก้ซ้ำ", "notes": "[38:00] ข้อ 5 เชื่อมกับ Plan → Approve → Execute: แผนที่ดีประหยัดทั้งเวลาและ usage\nM8 จะมีแบบฝึกเลือก model/วิธีให้คุ้ม", "type": "content"}, {"md": "<!-- type: section -->\n# Workshop · Data Traffic Light\n20 นาที · ข้อมูลนี้ใส่ Claude ได้ไหม?", "notes": "[40:00] เปลี่ยนโหมดเป็น workshop ส่งลิงก์ Artifact (หรือไฟล์ data-traffic-light.html) ให้ทุกคนก่อนเริ่ม", "type": "section"}, {"md": "# กติกาเกม\n\n```mermaid\nflowchart LR\n    B[\"บรีฟกติกา<br/>2 นาที\"]:::human --> P1[\"รอบ 1: เล่นเดี่ยว 15 ใบ<br/>ใน Artifact 8 นาที\"]:::human\n    P1 --> P2[\"รอบ 2: ให้ Claude ช่วย anonymize<br/>ไพ่เหลือง 1 ใบ 5 นาที\"]:::ai\n    P2 --> CK{\"คุณตรวจ: ยังมีชื่อ/<br/>ข้อมูลระบุตัวตนไหม?\"}:::human\n    CK --> DB[\"Debrief + กฎ 3 ข้อของฉัน<br/>Export PDF 5 นาที\"]:::human\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector\n\n- ไพ่ 15 ใบ: 🟢 ใช้ได้ · 🟡 ต้อง anonymize · 🔴 ห้ามใส่ Claude\n- ทุกใบเป็น **ข้อมูลสมมติ** · คู่มืออยู่ใน workshop.md", "notes": "[40:30] รอบ 1 (8 นาที): เล่นเดี่ยว คีย์ลัด 1/2/3 ดูเหตุผลทุกใบแม้ตอบถูก\nรอบ 2 (5 นาที): เลือกไพ่เหลือง 1 ใบ ใช้ prompt M1-P04 ให้ Claude ช่วย anonymize แล้วตรวจเองว่ายังเหลือข้อมูลระบุตัวตนไหม\nDebrief (5 นาที): โหวตใบที่ยากที่สุด เขียนกฎ 3 ข้อของฉัน แล้ว Export PDF\nวิทยากรเดินดู ถามคนที่ตอบใบ C10 (ปริมาณขาย + ชื่อลูกค้า) ว่าทำไมตอบแบบนั้น", "type": "content"}, {"md": "# Debrief: ใบที่คนพลาดบ่อย\n\n- **C05** รายงานที่ประกาศแล้ว = 🟢 แต่ฉบับร่าง = 🔴\n- **C10** ตัดชื่อลูกค้าได้ = 🟡 · มีราคา/สัญญา = 🔴\n- **C15** ข้อมูลสุขภาพ ลบชื่อแล้วก็ยัง 🔴\n- ไม่แน่ใจ → ถือเป็นสีที่ **เข้มกว่า** ไว้ก่อน", "notes": "[54:00] ใช้ผลจริงของห้อง: ถามว่าใบไหนตอบผิดเยอะที่สุด (ดูจากการยกมือ)\nหลัก \"ไม่แน่ใจ ให้เข้มไว้ก่อน\" สำคัญที่สุด\nถ้ามีเวลา ถาม: \"ข้อมูลเขียว แต่ใช้บัญชี Claude ส่วนตัว ได้ไหม?\" → ไม่ได้ (กฎข้อ 2)", "type": "content"}, {"md": "# สรุป M1 · พกติดตัวไปทั้งวัน\n\n- Claude/Cowork = Agent: คิด → วางแผน → ลงมือ · **เราอนุมัติและตรวจ**\n- เลือกเครื่องมือด้วย decision tree\n- บัญชีบริษัทเท่านั้น · ข้อมูลอ่อนไหวไม่ใส่ Claude\n- 🟢🟡🔴 ก่อนวางทุกครั้ง · ไม่แน่ใจให้เข้มไว้ก่อน\n- Skill ภายนอก: ที่มา · สิทธิ์ · Script · ส่งออก\n- ถัดไป M2: Cowork กับไฟล์และโฟลเดอร์จริง", "notes": "[58:00] ปิดด้วยการให้ทุกคนพูดกฎ 1 ข้อที่จำได้ แล้วพักเบรก 10:15–10:30\nเตือน: ระหว่างพักให้ตรวจว่า Cowork เปิดได้และมีไฟล์ Sample Data Pack พร้อมสำหรับ M2", "type": "content"}];
const deck = document.getElementById('deck');
marked.use({renderer:{code(code, lang){
  if(lang==='mermaid') return '<div class="mermaid" data-src="'+encodeURIComponent(code)+'"></div>';
  return false;}}});
SLIDES.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+s.type; el.innerHTML=marked.parse(s.md)+
    '<div class="foot"><span>'+(META.module||'')+' · '+(META.title||'')+'</span><span>'+(i+1)+' / '+SLIDES.length+'</span></div>';
  deck.appendChild(el);
  const n=document.createElement('div'); n.className='notes'; n.textContent=s.notes; deck.appendChild(n);
});
mermaid.initialize({startOnLoad:false,theme:'base',themeVariables:{fontFamily:'IBM Plex Sans Thai',fontSize:'20px'}});
let cur=Math.max(0,Math.min(SLIDES.length-1,(parseInt(location.hash.slice(1))||1)-1));
const slides=[...document.querySelectorAll('.slide')], notes=[...document.querySelectorAll('.notes')];
async function show(i){cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,j)=>s.classList.toggle('active',j===cur));
  notes.forEach((s,j)=>s.classList.toggle('active',j===cur));
  history.replaceState(null,'','#'+(cur+1));}
// Pre-render every diagram once (each slide made visible in turn so Mermaid can measure),
// so print/PDF export never depends on which slides were visited. mermaid.render with our
// own ids avoids the Date.now()-based id clashes of rapid mermaid.run calls.
async function renderAll(){await document.fonts.ready;
  for(let i=0;i<slides.length;i++){
    const pending=[...slides[i].querySelectorAll('.mermaid:not([data-processed])')];
    if(!pending.length) continue;
    slides[i].classList.add('active');
    for(let k=0;k<pending.length;k++){const el=pending[k];
      try{const {svg}=await mermaid.render('mmd-s'+i+'-'+k, decodeURIComponent(el.dataset.src)); el.innerHTML=svg;}
      catch(err){el.textContent='Diagram error: '+err.message;}
      el.dataset.processed='true';}
    if(i!==cur) slides[i].classList.remove('active');}
  document.body.dataset.ready='1';}
document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)) show(cur+1);
  if(['ArrowLeft','PageUp'].includes(e.key)) show(cur-1);
  if(e.key==='n') document.body.classList.toggle('show-notes');
  if(e.key==='p') rendered.then(()=>window.print());
});
show(cur);
const rendered=renderAll();
</script></body></html>
