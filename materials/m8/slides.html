<script>
const META = {"title": "Security Recap, Quiz & แผน 30 วัน", "module": "M8", "duration": "45 min (Lecture 20 / Workshop 25)"};
const SLIDES = [{"md": "<!-- type: section -->\n# M8 · Security Recap, Quiz & แผน 30 วัน\n\nทบทวนกฎ · ใช้ให้คุ้ม · Quiz · แผน 30 วันของฉัน · ปิดการอบรม\n\n16:15–17:00 · 45 นาที (บรรยาย 20 · Workshop 25)", "notes": "[0:00 · 16:15] ต่อจาก Show & Share ของ M7 ทันที ชมทีมที่ชนะโหวต 10 วินาที แล้วเข้าเรื่อง\nRequirement ที่ปิดในโมดูลนี้: 2 (Security & ข้อมูลอ่อนไหว · Personal vs Team), 3 (Connector · copy-before-write), 9 (Third-party Skill · ย้ำ), 13 (ใช้ให้คุ้ม · Hands-on เบา)\nให้ทุกคนเปิด 2 ไฟล์รอไว้: `artifacts/security-quiz.html` และ `artifacts/plan-30-days.html` (หรือลิงก์ Artifact ที่ Hi-I แชร์ให้)\nบอกตรง ๆ: \"45 นาทีสุดท้ายนี้ สิ่งที่เราอยากให้ติดตัวกลับไปคือ กฎ 6 ข้อ และแผน 1 หน้า\"", "type": "section"}, {"md": "# 45 นาทีสุดท้าย: ทบทวน → ลอง → วางแผน\n\n```mermaid\nflowchart LR\n    R[\"① ทบทวน 6 กฎ<br/>+ สิ่งที่ไม่ให้ Claude ทำ<br/>12 นาที\"]:::human --> U[\"② ใช้ให้คุ้ม<br/>model · แบ่งงาน · Project/Skill<br/>4 + 5 นาที\"]:::ai\n    U --> Q[\"③ Quiz 18 ข้อ<br/>+ รอบสุดท้าย Traffic Light<br/>12 นาที\"]:::human\n    C[(\"การ์ด Data Traffic Light<br/>จาก M1 (อ่านอย่างเดียว)\")]:::data --> Q\n    Q --> P[\"④ แผน 30 วันของฉัน<br/>Artifact + Export PDF<br/>8 นาที\"]:::human\n    M7[(\"การ์ดทีมจาก M7<br/>Show & Share PDF\")]:::data --> P\n    P --> E[\"⑤ Q&A · แบบประเมิน · ปิด<br/>4 นาที\"]:::human\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector", "notes": "[0:30] เดินตาม diagram เร็ว ๆ: ส่วนใหญ่เป็นสีส้ม เพราะช่วงนี้คือ \"เรา\" ตัดสินใจ ไม่ใช่ Claude\nผลลัพธ์ที่แต่ละคนต้องได้ก่อน 17:00: PDF ผล Quiz 1 ไฟล์ + PDF แผน 30 วัน 1 ไฟล์\nบอกว่า Quiz ไม่ได้ใช้ตัดเกรด ใช้ดูว่าเราควรทบทวนหมวดไหน (ถ้า Hi-I ต้องการเก็บคะแนน ดู Open question ใน README)", "type": "content"}, {"md": "<!-- type: story -->\n# ก.ย. 2023: ลิงก์แชร์ลิงก์เดียว เปิดข้อมูล 38TB\n\n- ทีมวิจัย AI ของ Microsoft แชร์ไฟล์ training data บน GitHub\n- ลิงก์ที่ใช้ (Azure SAS token) เปิด **ทั้ง storage account** ไม่ใช่แค่ไฟล์เดียว\n- สิทธิ์ \"แก้ไขได้\" ไม่ใช่ \"อ่านอย่างเดียว\" · ลิงก์หมดอายุปี 2051\n- ข้างในมี backup เครื่องพนักงาน รหัสผ่าน และข้อความ Teams 30,000+ ข้อความ\n- Wiz พบและแจ้ง Microsoft ปิดภายใน 2 วัน\n\n> ปัญหาไม่ใช่ AI ฉลาดเกินไป แต่คือ **คนแชร์กว้างเกินไป**", "notes": "[1:30] เล่า 1.5 นาที เคสจริงจาก Wiz Research (18 ก.ย. 2023) และ Microsoft MSRC ยืนยัน (SOURCES #1, #2)\nไทม์ไลน์: ลิงก์อยู่บน GitHub ตั้งแต่ ก.ค. 2020 · Wiz แจ้ง 22 มิ.ย. 2023 · Microsoft ยกเลิก token 24 มิ.ย. 2023 · MSRC ระบุว่าไม่มีข้อมูลลูกค้าหลุด\nทำไมเลือกเคสนี้ปิดวัน: ไม่มีใคร \"ตั้งใจ\" ทำผิด เป็นทีมเก่งด้าน AI ด้วยซ้ำ แค่ตั้งค่าการแชร์ผิด 1 จุด\nเชื่อมกับเรา: Claude Team ทำให้แชร์ Project / Artifact / ไฟล์ output ได้ง่ายมาก \"แชร์ง่าย = แชร์ผิดก็ง่าย\" (M1)\nคำถามชวนคิด: \"ลิงก์ไหนที่คุณเคยแชร์ แล้วไม่เคยกลับไปปิดเลย?\"", "type": "story"}, {"md": "# 6 กฎที่พกกลับบ้าน\n\n1. 🔴🟡🟢 **ข้อมูลอ่อนไหวไม่ใส่ Claude** · ไม่แน่ใจให้เข้มไว้ก่อน\n2. 🏢 **บัญชี Team ของบริษัทเท่านั้น** · แชร์ให้แคบที่สุด\n3. 🔌 **Connector ที่อนุมัติ: SharePoint + Outlook**\n4. 📄 **copy-before-write** · ไม่ให้ AI ทับไฟล์ที่แชร์\n5. 🧩 **Skill จากภายนอก = โปรแกรมแปลกหน้า** · ตรวจก่อนติดตั้ง\n6. 🟧 **Plan → Approve → Execute** · Claude ร่าง คนตัดสิน", "notes": "[3:00] สไลด์นี้คือ \"สรุปทั้งวัน\" 6 ข้อ แต่ละข้อมีสไลด์ทบทวนสั้น ๆ ต่อจากนี้ (ข้อละ ~1 นาที)\nให้ห้องอ่านออกเสียงพร้อมกันเร็ว ๆ หรือให้ชี้ว่ากฎข้อไหนเรียนในโมดูลไหน (1–2 = M1 · 3–4 = M3 · 5 = M5 · 6 = M2/M6)\nทั้ง 6 ข้อจะกลับมาเป็นหมวดใน Quiz", "type": "content"}, {"md": "# กฎ 1 · Data Traffic Light ก่อนวางทุกครั้ง\n\n```mermaid\nflowchart LR\n    D[(\"ข้อมูลที่จะใช้\")]:::data --> Q1{\"อ่อนไหว?<br/>บุคคล · สุขภาพ · การเงินยังไม่เปิดเผย<br/>· ความลับการค้า · รหัสผ่าน\"}:::human\n    Q1 -- ใช่ --> R[\"🔴 ห้ามใส่ Claude<br/>ใช้เครื่องมือที่บริษัทกำหนด\"]:::human\n    Q1 -- ไม่ --> Q2{\"มีชื่อคน · เบอร์<br/>· ชื่อคู่ค้า/ลูกค้า?\"}:::human\n    Q2 -- ใช่ --> Y[\"🟡 anonymize ก่อน\"]:::human\n    Q2 -- ไม่ --> G[\"🟢 ใช้ได้\"]:::human\n    Y --> G\n    G --> A{\"บัญชี Claude Team<br/>ของบริษัท?\"}:::human\n    A -- ใช่ --> C[\"Claude ทำงาน\"]:::ai\n    A -- บัญชีส่วนตัว --> S[\"หยุด\"]:::human\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector", "notes": "[4:00] diagram เดียวกับ M1 แบบย่อ ทุกกล่องที่เป็นคำถามคือสีส้ม = คนตัดสิน\nย้ำ 2 จุดที่คนพลาดบ่อยในเกมเมื่อเช้า: (1) ลบชื่อแล้วข้อมูลสุขภาพก็ยัง 🔴 (2) anonymize \"ก่อน\" ส่ง ไม่ใช่ให้ Claude ลบให้ทีหลัง\nรอบสุดท้ายของ Quiz จะใช้การ์ด 6 ใบจากเกม M1 อีกครั้ง", "type": "content"}, {"md": "# กฎ 2 · บัญชีบริษัทเท่านั้น และแชร์ให้แคบที่สุด\n\n```mermaid\nflowchart LR\n    O[\"Claude สร้าง Artifact /<br/>Project / ไฟล์ output\"]:::ai --> V{\"ตรวจเนื้อหา:<br/>มีข้อมูล 🟡🔴 หลุดไหม?\"}:::human\n    V -- มี --> F[\"แก้/ตัดออกก่อน\"]:::human\n    F --> V\n    V -- ไม่มี --> W{\"ใครต้องเห็นจริง ๆ?\"}:::human\n    W --> S[(\"แชร์ภายในองค์กร<br/>เฉพาะคน/กลุ่มที่จำเป็น<br/>SharePoint · Team\")]:::data\n    S --> X[\"ทบทวน/เลิกแชร์<br/>เมื่อหมดความจำเป็น\"]:::human\n    W -. ห้าม .-> P[\"ลิงก์สาธารณะ · LINE<br/>· อีเมลส่วนตัว\"]:::human\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector\n\n- **Personal AI ห้ามใช้กับข้อมูลบริษัท** แม้ข้อมูลเป็น 🟢\n- Team ≠ Enterprise: ระบบตรวจย้อนหลังน้อยกว่า วินัยอยู่ที่เรา", "notes": "[5:00] กฎนโยบายบ้านปู 2 ข้อจาก M1 ไม่มีข้อยกเว้น: ข้อมูลอ่อนไหวไม่ใส่ Claude · ห้าม Personal AI กับข้อมูลบริษัท\nเชื่อมกับเคส 38TB: ทุกครั้งที่จะแชร์ ถาม 3 คำถาม \"มีอะไรหลุดไหม · ใครต้องเห็นจริง · เมื่อไรจะปิด\"\nTeam = รถที่มีเบรก แต่ไม่มีเบรกอัตโนมัติ (analogy M1) ไม่มีใครเตือนก่อนเราแชร์ผิด\nตัวเลือกการแชร์ในเมนู Claude อาจเปลี่ยนตามเวอร์ชัน ให้ดูของจริงใน dry-run (ดู Open question ใน README)", "type": "content"}, {"md": "# กฎ 3–4 · Connector ที่อนุมัติ + copy-before-write\n\n```mermaid\nflowchart LR\n    AI[\"AI<br/>Claude / Cowork\"]:::ai --> CN[(\"Connect<br/>SharePoint · Outlook เท่านั้น\")]:::data\n    CN --> D[(\"Data<br/>อ่าน (Read) ก่อนเสมอ\")]:::data\n    D --> W{\"งานนี้ต้อง<br/>เขียน/แก้ไหม?\"}:::human\n    W -- ไม่ --> OUT[\"สรุป/รายงาน<br/>ลง output/\"]:::ai\n    W -- ต้องแก้ --> CP[\"copy-before-write<br/>ทำสำเนาก่อน\"]:::human\n    CP --> E[\"Execute บนสำเนา\"]:::ai\n    E --> CK{\"ตรวจผล<br/>+ แจ้งเจ้าของไฟล์\"}:::human\n    CK -- ผ่าน --> RP[(\"แทนที่/อัปโหลด<br/>โดยคน\")]:::data\n    CK -- ไม่ผ่าน --> E\n    GD[\"Google Drive /<br/>Connector อื่น\"]:::human -. ไม่อนุญาต .-> CN\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector", "notes": "[6:00] AI → Connect → Data → Execute จาก M3 ทวนในภาพเดียว\nRead ความเสี่ยงต่ำ · Write ความเสี่ยงสูง เพราะไฟล์ที่แชร์มีคนอื่นใช้อยู่ (นึกถึง Capex Tracker ที่หายครึ่งไฟล์ในเดโม M3)\nถ้ามีคนถามเรื่อง Google Drive / Connector อื่น: ไม่อนุญาตในบ้านปู ให้ใช้ SharePoint หรือ Outlook หรือดาวน์โหลดไฟล์ 🟢 มาใส่โฟลเดอร์สำเนาแทน\nคนเป็นผู้แทนที่ไฟล์จริงและแจ้งเจ้าของไฟล์ ไม่ใช่ให้ Claude ทับเอง", "type": "content"}, {"md": "# กฎ 5 · Skill จากภายนอก = โปรแกรมแปลกหน้า\n\n```mermaid\nflowchart LR\n    S[(\"Skill จากภายนอก<br/>GitHub · LINE · เพื่อนส่งมา\")]:::data --> R[\"Claude ช่วยอ่าน/สรุป<br/>แต่ไม่ติดตั้ง ไม่รัน\"]:::ai\n    R --> CL{\"Checklist 6 ข้อ<br/>ที่มา · สิทธิ์ · Script<br/>· ส่งออก · คำสั่งแอบแฝง<br/>· ผู้อนุมัติ/เวอร์ชัน\"}:::human\n    CL -- ธงแดง/ไม่แน่ใจ --> NO[\"ไม่ติดตั้ง<br/>ส่ง Hi-I / IT ตรวจ\"]:::human\n    CL -- ผ่าน + มีผู้อนุมัติ --> OK[\"ใช้เวอร์ชันที่อนุมัติ\"]:::ai\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector\n\n- ยอดดาวน์โหลดสูง ≠ ปลอดภัย\n- ใช้ Skill ที่ทีมสร้างเองหรือที่ Hi-I/IT รับรองก่อน", "notes": "[7:00] Requirement 9 (ย้ำ) — Checklist 6 ข้อจาก M5 (ที่มา · สิทธิ์ · Script · ส่งออก · คำสั่งแอบแฝง · ผู้อนุมัติ/เวอร์ชัน)\nทวนเคสที่เล่าไปแล้วแบบสั้นมาก ไม่ต้องเล่าซ้ำ: M1 Skill ที่แอบโหลดโค้ดมารัน · M5 Skill ปลอมหลายร้อยตัวในร้านสาธารณะ\nถามห้อง 1 คำถาม: \"เพื่อนส่ง Skill ZIP มาทาง LINE ทำอะไรก่อน?\" → ไม่ติดตั้ง ส่งตรวจ (Quiz ข้อ Q13)\nผู้อนุมัติ Skill ในบ้านปู: Hi-I / IT (รอคุณเก๊ยืนยัน ดู README)", "type": "content"}, {"md": "# กฎ 6 · Plan → Approve → Execute\n\n- Claude **วางแผนก่อน** · เรา **อ่านแผนก่อนอนุมัติ**\n- ทดลองกับสำเนาหรือบางส่วนก่อนทำทั้งหมด\n- ขอ **ที่มาของตัวเลข** · สุ่มตรวจอย่างน้อย 3 จุด\n- งานตั้งเวลา: AI ร่าง · **คนส่ง**\n- เจ้าของงาน 1 คน ชื่ออยู่บนผลลัพธ์\n\n> Human-in-the-Loop (HITL) = จุดที่ AI ต้องหยุดรอคนตรวจ/อนุมัติ", "notes": "[8:00] รวมหลัก HITL จากทั้งวัน: M2 (จัดโฟลเดอร์ 1,500 ไฟล์ต้องอ่านแผนก่อน) · M4 (ตรวจ 3 ตัวเลข) · M6 (ตั้งเวลาได้ แต่ไม่ตั้ง \"การส่ง\")\nคำถามที่ช่วยคนตรวจ: \"ถ้าผิด ใครเสียหาย และแก้คืนได้ไหม?\" ถ้าแก้คืนไม่ได้ = ต้องมีคนอนุมัติเสมอ\nสไลด์ถัดไปจะสรุปเป็นรายการ \"สิ่งที่ไม่ให้ Claude ทำ\"", "type": "content"}, {"md": "# สิ่งที่ไม่ให้ Claude ทำ (และให้ทำอะไรแทน)\n\n| ❌ ไม่ให้ Claude… | ✅ ให้ Claude… |\n|---|---|\n| ส่งอีเมล / แชร์ / โพสต์เอง | ร่างไว้ใน Drafts ให้เราตรวจแล้วกดส่ง |\n| ลบหรือเขียนทับไฟล์ที่แชร์ | ทำงานบนสำเนา (copy-before-write) |\n| อนุมัติ เงิน สัญญา HR แทนคน | สรุปทางเลือก + ข้อดีข้อเสีย ให้คนตัดสิน |\n| อ่านข้อมูล 🔴 หรือระบบนอก M365 | ใช้ข้อมูล 🟢 / 🟡 ที่ anonymize แล้ว |\n| ติดตั้ง Skill / รัน script แปลกหน้า | อ่านและสรุปความเสี่ยงของ Skill |\n| เป็นแหล่งข้อมูลสุดท้าย | ให้ที่มา แล้วเราตรวจกับต้นฉบับ |", "notes": "[9:00] Requirement 2 + 3: \"what NOT to let Claude do\" ตามที่ proposal ระบุ\nอ่านทีละแถวเร็ว ๆ เน้นคอลัมน์ขวา: เราไม่ได้ห้ามใช้ Claude แต่เปลี่ยน \"ทำแทน\" เป็น \"ร่าง/เสนอ/ทำบนสำเนา\"\nแถวสุดท้ายโยงกับเคส M4 (รายงานที่มีอ้างอิงปลอม): Claude เป็นผู้ช่วยร่าง ไม่ใช่แหล่งอ้างอิง\nPrompt `M8-P05` คือชุด \"กติกาประจำ Project\" ที่ใส่ข้อห้ามเหล่านี้ไว้ใน Project instructions ครั้งเดียว ใช้ได้ทุกแชต", "type": "content"}, {"md": "# ก่อนกด Allow / Approve: 4 คำถาม\n\n```mermaid\nflowchart LR\n    P[\"Claude เสนอแผน<br/>(Plan)\"]:::ai --> Q1{\"ส่งออกนอกตัวเรา?<br/>อีเมล · แชร์ · โพสต์\"}:::human\n    Q1 -- ใช่ --> D1[\"ให้ร่างไว้ใน Drafts<br/>คนกดส่งเอง\"]:::human\n    Q1 -- ไม่ --> Q2{\"ลบ / เขียนทับ<br/>ไฟล์ที่แชร์?\"}:::human\n    Q2 -- ใช่ --> D2[\"copy-before-write<br/>ห้ามลบต้นฉบับ\"]:::human\n    Q2 -- ไม่ --> Q3{\"ตัดสินใจแทนคน?<br/>อนุมัติ · เงิน · สัญญา · HR\"}:::human\n    Q3 -- ใช่ --> D3[\"Claude เสนอทางเลือก<br/>คนตัดสิน\"]:::human\n    Q3 -- ไม่ --> Q4{\"แตะข้อมูล 🔴 /<br/>ระบบนอก M365?\"}:::human\n    Q4 -- ใช่ --> D4[\"หยุด\"]:::human\n    Q4 -- ไม่ --> X[\"Approve → Execute\"]:::ai\n    D1 & D2 & D3 --> X\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector", "notes": "[10:30] ตารางสไลด์ก่อนหน้าแปลงเป็น 4 คำถามที่ถามตัวเองทุกครั้งที่ Cowork ขออนุญาต\nจำง่าย: \"ส่ง · ลบ · ตัดสิน · แดง\" ถ้าใช่ข้อไหน ให้ปรับแผนก่อนอนุมัติ\nห้ามกด \"Allow always\" กับงานที่ตอบ \"ใช่\" ข้อใดข้อหนึ่ง (เชื่อมกับ M6: ทดลอง 4 รอบก่อนลดการถาม)\nช่วงทบทวนกฎจบที่นี่ (~12 นาที) ไปต่อเรื่องใช้ให้คุ้ม", "type": "content"}, {"md": "<!-- type: section -->\n# ใช้ให้คุ้ม ภายใต้ weekly limit\nเลือก model · แบ่งงาน · ไม่ส่ง context ซ้ำ", "notes": "[12:00] Requirement 13 (Hands-on เบา) M1 ให้แนวคิด M5 แสดงว่า Skill ช่วยประหยัดอย่างไร M8 ให้ลงมือเลือกจริงใน workshop ภารกิจ 1", "type": "section"}, {"md": "# อะไรกิน usage มากที่สุด\n\n| กิน usage มาก | ทางเลือกที่คุ้มกว่า |\n|---|---|\n| แชตเดียวยาวทั้งวัน | สรุปสถานะ → เริ่มแชตใหม่ |\n| แนบทั้งไฟล์/ทั้งโฟลเดอร์ | ส่งเฉพาะชีต/คอลัมน์/ช่วงที่ใช้ |\n| Opus กับงานง่าย | Haiku/Sonnet ก่อน ยกระดับเมื่อจำเป็น |\n| พิมพ์คำสั่งยาว + ตัวอย่างซ้ำทุกเดือน | Project instructions / Skill |\n| ให้ Claude อ่านข้อมูล 200,000 แถวเอง | ให้เขียนสคริปต์สรุป ทดลองตัวอย่างเล็ก |\n| สั่งกว้าง ๆ แล้วแก้หลายรอบ | ขอแผนก่อน (Plan → Approve) |", "notes": "[13:00] หลักคิดเดียว: usage ขึ้นกับปริมาณที่ Claude ต้องอ่าน + ขนาด model + จำนวนรอบที่แก้\nทุกแถวเคยเจอมาแล้วในวันนี้: แชตยาว (M1) · ข้อมูลขนาดจริง (M2/M4) · Skill (M5) · Plan → Approve (M2)\nย้ำ: limit เป็น \"ต่อคน\" ดูที่ Settings → Usage ตัวเลขโควตาจริงให้ดูจากหน้าจอ ไม่ต้องจำตัวเลข (SOURCES M1 #6)\nห้ามแก้ปัญหาโควตาด้วยการเปลี่ยนไปใช้บัญชีส่วนตัว (Quiz Q16)", "type": "content"}, {"md": "# 3 เทคนิค: เลือก model · แบ่งงาน · Project/Skill\n\n```mermaid\nflowchart LR\n    T[\"งานใหม่\"]:::human --> R{\"ทำซ้ำทุกสัปดาห์/เดือน?\"}:::human\n    R -- ใช่ --> PS[(\"Project / Skill<br/>เก็บคำสั่ง + ตัวอย่างไว้\")]:::data\n    R -- ไม่ --> M{\"ยากแค่ไหน?\"}:::human\n    PS --> M\n    M -- ง่าย/ซ้ำ --> H[\"Haiku\"]:::ai\n    M -- ทั่วไป --> S[\"Sonnet (ค่าเริ่มต้น)\"]:::ai\n    M -- ยาก/สำคัญ --> O[\"Opus\"]:::ai\n    BIG[(\"ไฟล์ใหญ่ · หลายขั้น\")]:::data --> SP[\"แบ่งงาน: วางแผนก่อน<br/>ทำทีละส่วน · ทดลองตัวอย่างเล็ก\"]:::human\n    SP --> M\n    H & S & O --> CK[\"แชตยาว → สรุป แล้วเริ่มแชตใหม่<br/>ดู Settings → Usage\"]:::human\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector", "notes": "[14:00] 3 เทคนิค: (1) เลือก model ให้พอดีงาน (2) แบ่งงานใหญ่เป็นขั้น ทดลองกับตัวอย่างเล็ก (3) Project/Skill ไม่ต้องส่ง context ซ้ำ\nชื่อ model ในเมนูอาจมีเลขเวอร์ชันต่างจากสไลด์ ให้ดูของจริง · บาง model บน Team อาจใช้ usage เร็วกว่า (ยืนยันใน dry-run)\nใน workshop ภารกิจ 1 จะได้ลอง 3 โจทย์ + prompt `M8-P01` (สรุปเพื่อเริ่มแชตใหม่) และ `M8-P02` (ขอแผนแบ่งงาน + เลือก model)", "type": "content"}, {"md": "# ตัวอย่าง: งานรายงานรายเดือน ทำแบบคุ้ม\n\n| ขั้น | ทำอะไร | model |\n|---|---|---|\n| ครั้งเดียว | Project \"รายงานเดือน\" ใส่ instructions + template + กติกา `M8-P05` | – |\n| 1 | ให้ Claude **วางแผน** ว่าใช้ไฟล์ไหน คอลัมน์ไหน | Sonnet |\n| 2 | ทดลองกับข้อมูล 1 site ก่อน ตรวจ 3 ตัวเลข | Sonnet |\n| 3 | รันครบทุก site ด้วยสคริปต์ที่ผ่านแล้ว | Sonnet |\n| 4 | ขัดภาษาบทสรุปผู้บริหาร | Haiku |\n| 5 | แชตยาวเกิน → `M8-P01` สรุป แล้วเริ่มแชตใหม่ใน Project | – |", "notes": "[15:00] ตัวอย่างสมมติ ใช้ข้อมูลรูปแบบเดียวกับ Monthly Operations Report ใน M4\nประเด็น: Opus ไม่จำเป็นในงานนี้ ใช้เมื่องานยากจริง เช่น วิเคราะห์ความเสี่ยงหลายเงื่อนไขที่ Sonnet ทำได้ไม่ดี\nขั้น 2 คือ \"แบ่งงาน\" ที่ช่วยทั้งคุณภาพและ usage: ถ้าผิดตั้งแต่ site แรก เราเสียแค่รอบเล็ก ไม่ใช่ทั้งรอบ\nขั้น \"ครั้งเดียว\" คือการลงทุนที่คืนทุนตั้งแต่เดือนที่ 2 (เหมือน Skill ใน M5)", "type": "content"}, {"md": "<!-- type: section -->\n# Workshop 25 นาที · 3 ภารกิจ\n\n```mermaid\nflowchart LR\n    M1[\"ภารกิจ 1 · ใช้ให้คุ้ม<br/>3 โจทย์ + M8-P01/P02<br/>5 นาที\"]:::ai --> O[(\"security-quiz.html<br/>18 ข้อ · 6 หมวด\")]:::data\n    O --> A[\"ภารกิจ 2 · Quiz<br/>ตอบเดี่ยว ดูเหตุผลทุกข้อ<br/>9 นาที\"]:::human\n    C[(\"การ์ด Traffic Light<br/>M1 · อ่านอย่างเดียว\")]:::data --> F[\"รอบสุดท้าย 6 ใบ<br/>10 วินาที/ใบ · 3 นาที\"]:::human\n    A --> F --> X[\"Export PDF ผล Quiz\"]:::human\n    X --> P[\"ภารกิจ 3 · แผน 30 วัน<br/>plan-30-days.html · 8 นาที\"]:::human\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector\n\nคู่มือ: `workshop.md` หน้า 1–5 · Prompt: `prompts.md` (M8-P01…P07)", "notes": "[16:00] อธิบาย 30 วินาที แล้วเริ่มนับเวลา (16:31)\nภารกิจ 1 ทำในบัญชี Claude Team ของตัวเอง ใช้ข้อความสมมติในคู่มือเท่านั้น\nภารกิจ 2 Quiz เปิดไฟล์ HTML หรือลิงก์ Artifact ไม่เรียก AI ไม่กิน usage · คะแนนไม่ถูกส่งไปไหน (อยู่ในเครื่อง)\nภารกิจ 3 ต่อจากการ์ดทีม M7: เอา \"แผนต่อยอด\" ของทีมมาเป็นแผนส่วนตัว", "type": "section"}, {"md": "# แผน 30 วันของฉัน: 1 งาน · 4 สัปดาห์ · มีคนเช็ก\n\n```mermaid\nflowchart LR\n    U[(\"use case ของฉัน<br/>+ การ์ดทีมจาก M7\")]:::data --> I[\"Interview pattern<br/>Claude ถามทีละข้อ\"]:::ai\n    I --> W1[\"สัปดาห์ 1<br/>เลือก 1 งาน 🟢 · ตั้ง Project\"]:::human\n    W1 --> W2[\"สัปดาห์ 2<br/>ทำจริง 3 ครั้ง · จดเวลา\"]:::ai\n    W2 --> W3[\"สัปดาห์ 3<br/>ทำ Skill / Template · ชวนเพื่อน 1 คน\"]:::ai\n    W3 --> W4[\"สัปดาห์ 4<br/>วัดผล · แชร์ทีม · เลือกงานถัดไป\"]:::human\n    W1 & W2 & W3 & W4 --> CI{\"Check-in ทุกศุกร์<br/>กับ buddy / หัวหน้า\"}:::human\n    CI --> PDF[(\"Export PDF<br/>เก็บใน SharePoint ของทีม\")]:::data\n    classDef human fill:#E4572E,color:#fff,stroke:#1F2933;\n    classDef ai fill:#2E86AB,color:#fff,stroke:#1F2933;\n    classDef data fill:#3BA55C,color:#fff,stroke:#1F2933;\n```\n🟧 คน (HITL) · 🟦 AI · 🟩 Data/Connector", "notes": "[16:30] หลักของแผน: \"เล็กแต่ทำจริง\" 1 งาน ทำซ้ำได้ มีเจ้าของ มี check-in\nช่องที่ต้องกรอกใน Artifact: use case (สีข้อมูล 🟢/🟡) · เครื่องมือ (Chat/Project/Skill/Cowork/Artifact) · Connector · เจ้าของ · buddy · ตัวชี้วัด (เวลาที่ประหยัดต่อครั้ง) · check-in 4 ครั้ง\nArtifact จะเตือนถ้าเลือกข้อมูล 🔴 หรือไม่มีจุด HITL · ใช้ prompt `M8-P03` (Interview pattern) ถ้านึกไม่ออกว่าจะเริ่มงานไหน\ncheck-in ใส่ในปฏิทิน Outlook เอง หรือให้ Claude ร่าง invite ไว้ใน Drafts (`M8-P04`) ไม่ส่งเอง\n[Workshop เริ่ม 16:31 → จบ 16:56 · ดู workshop.md หน้า 1–5]", "type": "content"}, {"md": "# Debrief Quiz: ข้อที่คนพลาดบ่อย\n\n- **ลบชื่อแล้ว ≠ ปลอดภัย** · เงินเดือน + เลขบัตร ยัง 🔴 (Q01)\n- **anonymize ก่อนส่ง** ไม่ใช่หลังได้ผล (Q02)\n- **Team ไม่เตือนเรา** · วินัยอยู่ที่ผู้ใช้ (Q04)\n- **ยอดดาวน์โหลดสูง ≠ Skill ปลอดภัย** (Q14)\n- **โควตาใกล้หมด ≠ เหตุผลใช้บัญชีส่วนตัว** (Q16)\n\n> ไม่แน่ใจ → ถือเป็นสีที่เข้มกว่า และถามก่อน", "notes": "[Lecture 17:00 · 16:56] Debrief 1.5 นาที ใช้ผลจริงของห้อง: ถามว่าใครได้ 15+ ข้อ (ยกมือ) แล้วถามว่าข้อไหนพลาด\n5 ข้อนี้คาดการณ์ว่าพลาดบ่อย ถ้าห้องพลาดข้ออื่น ให้เปิด `trainer/answer-key.md` แล้วอธิบายข้อนั้นแทน\nรอบสุดท้าย Traffic Light: ถามว่าการ์ดไหนลังเลที่สุด (มักเป็น C10 ปริมาณขาย + ชื่อลูกค้า และ C05 รายงานที่ประกาศแล้ว)", "type": "content"}, {"md": "# ถาม-ตอบ และแบบประเมิน\n\n- คำถามที่ยังค้าง → เขียนลง **Parking lot** วิทยากรตอบภายหลังผ่าน Hi-I\n- แบบประเมินหลักสูตร: 3 นาที (ลิงก์/QR จาก Hi-I)\n- ติดต่อหลังอบรม: ทีม **Hi-I / AI Transformation**\n- เรื่องสิทธิ์ Connector / Skill / ข้อมูลอ่อนไหว → ถาม Hi-I / IT ก่อนทำ", "notes": "[18:30 · 16:58] เปิดรับคำถาม 1–2 ข้อจริง ๆ ถ้าคำถามยาว ให้จดลง Parking lot (กระดาษหรือ SharePoint List ของคลาสที่ Hi-I เตรียม)\nแบบประเมิน: ใช้ฟอร์มทางการของ Hi-I (Microsoft Forms) ใส่ QR บนสไลด์นี้วันจริง (Open question ใน README) คำถามแนะนำอยู่ใน workshop หน้า 5\nห้ามให้ผู้เรียนใส่ข้อมูลอ่อนไหวในคำถาม Parking lot", "type": "content"}, {"md": "# พรุ่งนี้เริ่มอะไร?\n\n1. เปิดแผน 30 วัน ใส่ check-in ศุกร์แรกใน Outlook\n2. ตั้ง Project แรก + กติกา `M8-P05`\n3. ทำงาน 🟢 จริง 1 งาน · จดเวลาที่ประหยัด\n\n> Claude ร่าง · วิเคราะห์ · เสนอ — **คนตัดสิน ตรวจ และรับผิดชอบ**\n\nขอบคุณครับ 🙏", "notes": "[19:30 · 16:59] ปิดด้วยประโยคเดียว ให้ห้องอ่านพร้อมกัน\nเตือน 2 เรื่องก่อนออกจากห้อง: (1) Export PDF ทั้ง 2 ไฟล์แล้วหรือยัง (2) Pause Scheduled task ที่สร้างใน M6 ถ้ายังไม่ได้รับอนุญาตใช้กับข้อมูลจริง\nขอบคุณ Hi-I / AI Transformation team และผู้เรียน · 17:00 ปิดการอบรม", "type": "content"}];
const deck = document.getElementById('deck');
marked.use({renderer:{code(code, lang){
  if(lang==='mermaid') return '<div class="mermaid" data-src="'+encodeURIComponent(code)+'"></div>';
  return false;}}});
SLIDES.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+s.type; el.innerHTML=marked.parse(s.md)+
    '<div class="foot"><span>'+(META.module||'')+' · '+(META.title||'')+'</span><span>'+(i+1)+' / '+SLIDES.length+'</span></div>';
  deck.appendChild(el);
  const n=document.createElement('div'); n.className='notes'; n.textContent=s.notes; deck.appendChild(n);
});
mermaid.initialize({startOnLoad:false,theme:'base',themeVariables:{fontFamily:'IBM Plex Sans Thai',fontSize:'20px'}});
let cur=Math.max(0,Math.min(SLIDES.length-1,(parseInt(location.hash.slice(1))||1)-1));
const slides=[...document.querySelectorAll('.slide')], notes=[...document.querySelectorAll('.notes')];
async function show(i){cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,j)=>s.classList.toggle('active',j===cur));
  notes.forEach((s,j)=>s.classList.toggle('active',j===cur));
  history.replaceState(null,'','#'+(cur+1));}
// Pre-render every diagram once (each slide made visible in turn so Mermaid can measure),
// so print/PDF export never depends on which slides were visited. mermaid.render with our
// own ids avoids the Date.now()-based id clashes of rapid mermaid.run calls.
async function renderAll(){await document.fonts.ready;
  for(let i=0;i<slides.length;i++){
    const pending=[...slides[i].querySelectorAll('.mermaid:not([data-processed])')];
    if(!pending.length) continue;
    slides[i].classList.add('active');
    for(let k=0;k<pending.length;k++){const el=pending[k];
      try{const {svg}=await mermaid.render('mmd-s'+i+'-'+k, decodeURIComponent(el.dataset.src)); el.innerHTML=svg;}
      catch(err){el.textContent='Diagram error: '+err.message;}
      el.dataset.processed='true';}
    if(i!==cur) slides[i].classList.remove('active');}
  document.body.dataset.ready='1';}
document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)) show(cur+1);
  if(['ArrowLeft','PageUp'].includes(e.key)) show(cur-1);
  if(e.key==='n') document.body.classList.toggle('show-notes');
  if(e.key==='p') rendered.then(()=>window.print());
});
show(cur);
const rendered=renderAll();
</script></body></html>
